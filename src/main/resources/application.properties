spring.application.name=performance
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/performance?useSSL=false&serverTimezone=Europe/Rome&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:toor}
spring.datasource.name=performance
